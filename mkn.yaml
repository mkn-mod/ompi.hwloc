
name: ompi.hwloc
version: master
property:
    ompi.hwloc.scm: https://github.com/mkn-nix/ompi.hwloc

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep:
    - name: mkn.mod
    - name: ompi.hwloc
      scm: ${ompi.hwloc.scm}
      local: ${MKN_REPO}/ompi/hwloc/${version}
  if_arg:
      win_shared: -DYAML_CPP_DLL
      shared: -DMKN_KUL_SHARED

- name: test
  mod: ompi.hwloc
  main: test.cpp

- name: test_header
  mod: |
    ompi.hwloc{compile{header: mkn/ompi/hwloc.hpp}}
  main: test.cpp
  arg: -DMKN_OMPI_HWLOC_TEST_HEADER

- name: format
  mod: |
    clang.format{init{style: google, paths: .}}
